---
- name: Set up nginx and certbot
  hosts: webservers
  become: true
  gather_facts: true
  vars:
    certbot_webroot: /var/www/letsencrypt

  handlers:
    - name: Validate nginx configuration
      ansible.builtin.command: nginx -t
      changed_when: false
      listen: nginx config changed

    - name: Reload nginx
      ansible.builtin.systemd:
        name: nginx
        state: reloaded
      listen: nginx config changed

  tasks:
    - name: Check supported distribution
      ansible.builtin.assert:
        that: ansible_facts["os_family"] == "Debian" or ansible_facts["distribution"] == "Fedora"
        fail_msg: Only Debian/Ubuntu and Fedora hosts are supported

    - name: Check site configuration
      ansible.builtin.assert:
        that:
          - nginx_sites is defined
          - nginx_sites | length > 0
        fail_msg: Define nginx_sites for this host in the inventory

    - name: Install nginx and certbot on Debian/Ubuntu
      ansible.builtin.apt:
        name:
          - nginx
          - certbot
        state: present
        update_cache: true
      when: ansible_facts["os_family"] == "Debian"

    - name: Install nginx and certbot on Fedora
      ansible.builtin.dnf:
        name:
          - nginx
          - certbot
          - python3-libselinux
          - python3-libsemanage
        state: present
        update_cache: true
      when: ansible_facts["distribution"] == "Fedora"

    - name: Allow nginx to connect to upstreams under SELinux
      ansible.posix.seboolean:
        name: httpd_can_network_connect
        state: true
        persistent: true
      when: ansible_facts["selinux"]["status"] == "enabled"

    - name: Create ACME challenge webroot
      ansible.builtin.file:
        path: "{{ certbot_webroot }}"
        state: directory
        mode: "0755"
        setype: httpd_sys_content_t

    - name: Remove default nginx site
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: nginx config changed

    - name: Configure default HTTP server
      ansible.builtin.copy:
        dest: /etc/nginx/conf.d/default.conf
        mode: "0644"
        content: |
          map $http_upgrade $connection_upgrade {
              default upgrade;
              ''      close;
          }

          server {
              listen 80 default_server;
              listen [::]:80 default_server;
              server_tokens off;

              location /.well-known/acme-challenge/ {
                  root {{ certbot_webroot }};
              }

              location / {
                  return 301 https://$host$request_uri;
              }
          }
      notify: nginx config changed

    - name: Apply nginx configuration before requesting certificates
      ansible.builtin.meta: flush_handlers

    - name: Enable and start nginx
      ansible.builtin.systemd:
        name: nginx
        state: started
        enabled: true

    - name: Obtain certificates
      ansible.builtin.command:
        cmd: >-
          certbot certonly --webroot
          --webroot-path {{ certbot_webroot }}
          --cert-name {{ site.domain }}
          --domain {{ site.domain }}
          --non-interactive --agree-tos --register-unsafely-without-email
        creates: "/etc/letsencrypt/live/{{ site.domain }}/fullchain.pem"
      loop: "{{ nginx_sites }}"
      loop_control:
        loop_var: site
        label: "{{ site.domain }}"

    - name: Create certbot deploy hook directory
      ansible.builtin.file:
        path: /etc/letsencrypt/renewal-hooks/deploy
        state: directory
        mode: "0755"

    - name: Reload nginx after certificate renewal
      ansible.builtin.copy:
        dest: /etc/letsencrypt/renewal-hooks/deploy/reload-nginx
        mode: "0755"
        content: |
          #!/bin/sh
          systemctl reload nginx

    - name: Enable certbot renewal timer
      ansible.builtin.systemd:
        name: "{{ certbot_timer }}"
        state: started
        enabled: true
      vars:
        certbot_timer: "{{ 'certbot.timer' if ansible_facts['os_family'] == 'Debian' else 'certbot-renew.timer' }}"

    - name: Gather installed package versions
      ansible.builtin.package_facts:

    - name: Configure sites
      ansible.builtin.template:
        src: nginx-site.conf.j2
        dest: "/etc/nginx/conf.d/{{ site.domain }}.conf"
        mode: "0644"
      vars:
        nginx_version: "{{ ansible_facts['packages']['nginx'][0]['version'] | split('-') | first }}"
      loop: "{{ nginx_sites }}"
      loop_control:
        loop_var: site
        label: "{{ site.domain }}"
      notify: nginx config changed
