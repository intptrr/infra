---
- name: Install packages
  hosts: all
  gather_facts: true
  vars:
    brew_packages:
      - bat
      - eza
      - fd
      - fzf
      - gh
      - git
      - jq
      - mise
      - neovim
      - ripgrep
      - starship
      - tmux
      - zoxide
      - zsh

    apt_packages:
      - bat
      - curl
      - eza
      - fd-find
      - fzf
      - gh
      - git
      - jq
      - mise
      - neovim
      - ripgrep
      - starship
      - tmux
      - zoxide
      - zsh

    dnf_packages:
      - bat
      - curl
      - eza
      - fd-find
      - fzf
      - gh
      - git
      - jq
      - mise
      - neovim
      - ripgrep
      - starship
      - tmux
      - zoxide
      - zsh

    deb_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64', 'armv7l': 'armhf'}.get(ansible_facts['architecture'], ansible_facts['architecture']) }}"

  tasks:
    - name: Install packages via Homebrew
      community.general.homebrew:
        name: "{{ brew_packages }}"
        state: present
      register: brew_result
      when: ansible_facts["os_family"] == "Darwin"

    - name: Add GitHub CLI apt repository
      ansible.builtin.deb822_repository:
        name: github-cli
        uris: https://cli.github.com/packages
        suites: stable
        components: main
        architectures: "{{ deb_arch }}"
        signed_by: https://cli.github.com/packages/githubcli-archive-keyring.gpg
        install_python_debian: true
      become: true
      when: ansible_facts["os_family"] == "Debian"

    # Pin the architecture: the PPA lists amd64v3 but builds nothing for it, and
    # apt on amd64v3 hosts would use that empty package list instead of amd64.
    - name: Add mise apt repository
      ansible.builtin.deb822_repository:
        name: mise
        uris: https://ppa.launchpadcontent.net/jdxcode/mise/ubuntu
        suites: "{{ ansible_facts['distribution_release'] }}"
        components: main
        architectures: "{{ deb_arch }}"
        signed_by: "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x38A097C0CCE691795E4B15BE23997D3EEE1EDC52"
        install_python_debian: true
      become: true
      when: ansible_facts["os_family"] == "Debian"

    - name: Install packages via apt
      ansible.builtin.apt:
        name: "{{ apt_packages }}"
        state: present
        update_cache: true
      become: true
      register: apt_result
      when: ansible_facts["os_family"] == "Debian"

    - name: Enable mise copr repository
      community.general.copr:
        name: jdxcode/mise
        state: enabled
      become: true
      when: ansible_facts["os_family"] == "RedHat"

    - name: Enable starship copr repository
      community.general.copr:
        name: atim/starship
        state: enabled
      become: true
      when: ansible_facts["os_family"] == "RedHat"

    - name: Install packages via dnf
      ansible.builtin.dnf:
        name: "{{ dnf_packages }}"
        state: present
        update_cache: true
      become: true
      register: dnf_result
      when: ansible_facts["os_family"] == "RedHat"

    - name: Show changes
      ansible.builtin.debug:
        msg: "{{ changes if changes else 'no changes' }}"
      vars:
        brew_changes: >-
          {{ (brew_result.changed_pkgs | default([]))
             if ansible_facts['os_family'] == 'Darwin' else [] }}
        apt_changes: >-
          {{ (apt_result.stdout_lines | default([]))
             if ansible_facts['os_family'] == 'Debian' else [] }}
        dnf_changes: >-
          {{ (dnf_result.results | default([]))
             if ansible_facts['os_family'] == 'RedHat' else [] }}
        changes: "{{ brew_changes + apt_changes + dnf_changes }}"
